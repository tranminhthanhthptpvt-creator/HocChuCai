<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Bé Học Chữ Cái Tiếng Việt - Phát Âm Chuẩn Kèm Từ Minh Họa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>

  <!-- Thanh điều khiển trên cùng (Tối ưu gọn gàng cho điện thoại) -->
  <header class="top-bar">
    <div class="logo">
      <span class="logo-icon">🔤</span>
      <span class="logo-text">Bé Học Chữ Cái</span>
    </div>

    <div class="controls">
      <!-- Chọn cách đọc âm / tên chữ -->
      <select id="voice-mode" class="select-btn" aria-label="Cách đọc">
        <option value="phonics" selected>Âm chuẩn (Bờ, Cờ...)</option>
        <option value="name">Tên chữ (Bê, Xê...)</option>
      </select>

      <!-- Chọn thứ tự -->
      <select id="order-mode" class="select-btn" aria-label="Thứ tự">
        <option value="order">A ➔ Y</option>
        <option value="random">Đố bé 🔀</option>
      </select>

      <!-- Bật/Tắt âm thanh -->
      <button id="btn-sound" class="btn-toggle" title="Bật/Tắt âm thanh" aria-label="Bật/Tắt âm thanh">
        <span class="btn-icon">🔊</span>
      </button>
    </div>
  </header>

  <!-- Vùng hiển thị thẻ học chính -->
  <main id="main-area" class="main-card">
    <!-- Nút lùi -->
    <button id="btn-prev" class="nav-arrow nav-prev" title="Chữ trước" aria-label="Chữ trước">❮</button>

    <div id="content-display" class="content-display">
      <!-- Cặp chữ cái lớn -->
      <div id="letters" class="letter-display active">A a</div>

      <!-- Nhãn phiên âm gọn gàng -->
      <div id="pronounce-tag" class="pronounce-tag">Âm: A</div>

      <!-- Thẻ từ vựng minh họa với hình ảnh to rõ cho bé dễ nhìn -->
      <div id="word-card" class="word-card" title="Chạm vào để nghe từ minh họa">
        <div class="word-icon-container">
          <span id="word-icon" class="word-icon">🐟</span>
        </div>
        <div id="word-text" class="word-text">Con C<span class="hl-char">á</span></div>
      </div>

      <!-- Nút phát âm lại -->
      <div class="action-buttons">
        <button id="btn-speak" class="speak-btn">
          <span class="speak-icon">🔊</span>
          <span>Nghe lại</span>
        </button>
      </div>
    </div>

    <!-- Nút tiến -->
    <button id="btn-next" class="nav-arrow nav-next" title="Chữ tiếp theo" aria-label="Chữ tiếp theo">❯</button>
  </main>

  <!-- Hướng dẫn ngắn gọn -->
  <div class="instruction">
    👉 <em>Chạm vào màn hình để sang chữ mới. Chạm vào hình để nghe từ minh họa!</em>
  </div>

  <!-- Thanh 29 chữ cái cuộn ngang mượt mà trên điện thoại -->
  <footer class="alphabet-nav">
    <div id="alphabet-grid" class="alphabet-grid">
      <!-- Render bằng JavaScript -->
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
